<h1>Step 2: Materials Recommendation</h1>

<p><strong>Design:</strong> {{ design_name }}</p>

<form method="POST" action="/predict_materials">
    <input type="hidden" name="square_feet" value="{{ square_feet }}">
    <input type="hidden" name="plot_cents" value="{{ plot_cents }}">
    <input type="hidden" name="design_name" value="{{ design_name }}">

    Budget (₹): <input type="number" name="budget" required><br><br>
    <button type="submit">Predict Materials</button>
</form>
